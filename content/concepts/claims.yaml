id: claims
title: 債権・債務
order: 4
concepts:
  - id: loan
    name: 貸付金・借入金
    reading: [かしつけきん, かりいれきん]
    short: 貸したお金は後で返してもらう権利(資産)、借りたお金は後で返す義務(負債)
    summary: お金を貸すと貸付金という資産、借りると借入金という負債になる。貸付金の回収は権利が預金に形を変えるだけ、借入金の返済は預金と義務が同じだけ減るだけで、どちらももうけは動かない。
    example: 友人の店に100,000円を貸せば貸付金100,000円。銀行から300,000円借りていれば借入金300,000円。
    requires: [asset, liability]
    related: [interest]
    contrasts: []
  - id: interest
    name: 利息
    reading: [りそく]
    short: お金を貸し借りするときの「使用料」。受け取れば収益、払えば費用
    summary: 貸した側は受取利息(収益)、借りた側は支払利息(費用)。元本の返済とは別に記録する。利息は「元本 × 年利率 × 期間(月数 ÷ 12)」で計算する。
    example: 300,000円を年利2%で借りて半年なら、利息は300,000 × 2% × 6/12 = 3,000円。
    requires: [loan, revenue, expense]
    related: [principal, annual_interest_rate]
    contrasts: []
  - id: principal
    name: 元本
    aliases: [元金]
    reading: [がんぽん]
    short: 貸し借りしたお金そのもの。利息は含まない
    summary: 借りた側は元本を返したときだけ借入金が減り、貸した側は元本を返してもらったときだけ貸付金が減る。利息は元本とは別に、受取利息(収益)や支払利息(費用)として記録する。
    example: 100,000円を貸して、返済で100,000円、利息で2,000円を受け取ったなら、元本は100,000円。2,000円は元本に含めない。
    requires: [loan]
    related: [interest]
    contrasts: []
  - id: annual_interest_rate
    name: 年利率
    aliases: [年利, 利率]
    reading: [ねんりりつ]
    short: 1年あたりの利息の、元本に対する割合
    summary: 1年間借りたときの利息が元本の何%かを表す。1年より短い期間の利息は、月数 ÷ 12を掛けて求める。
    example: 年利率2%で300,000円を借りると、1年分の利息は300,000 × 2% = 6,000円、半年分なら6,000 × 6/12 = 3,000円。
    requires: [interest, principal]
    related: [interest]
    contrasts: []
  - id: non_trade_receivable_payable
    name: 未収入金・未払金
    reading: [みしゅうにゅうきん, みばらいきん]
    short: 商品以外の物を売り買いして、まだ受け取っていない代金と、まだ払っていない代金
    summary: 売掛金・買掛金は商品の売買にだけ使う。備品や車などそれ以外の物を後払いで売り買いしたときは、未収入金(資産)と未払金(負債)で記録して本業の取引と区別する。
    example: 古いショーケースを50,000円で売り、代金は来月なら未収入金。新しい椅子を80,000円で買い、代金は来月なら未払金。
    requires: [asset, liability]
    related: []
    contrasts: []
  - id: advance_payment_receipt
    name: 前払金・前受金
    reading: [まえばらいきん, まえうけきん]
    short: 商品を受け渡す前にやり取りした手付金。払った側は前払金(資産)、受け取った側は前受金(負債)
    summary: 手付金を払った時点では商品を受け取る権利を持っているだけなので前払金(資産)。受け取った側は商品を渡す義務があるので前受金(負債)。商品が動いたときに仕入や売上へ振り替える。
    example: 新しい豆の予約で10,000円を先に払えば前払金。豆が届いたら、その10,000円は仕入の一部になる。
    requires: [asset, liability]
    related: []
    contrasts: []
  - id: advances_and_deposits
    name: 立替金・預り金
    reading: [たてかえきん, あずかりきん]
    short: 他人の代わりに払ってあげたお金(立替金)と、他人の代わりに納めるために預かっているお金(預り金)
    summary: どちらも会社自身のお金の出入りではない。立替金は後で本人から返してもらう権利(資産)、預り金は後で代わりに納める義務(負債)。費用や収益にはならない。
    example: 従業員の給料100,000円から所得税3,000円を差し引いて預かり、後日税務署に納める。預かっている間は預り金。
    requires: [asset, liability]
    related: []
    contrasts: []
  - id: suspense_accounts
    name: 仮払金・仮受金
    reading: [かりばらいきん, かりうけきん]
    short: 金額や使い道がまだ決まっていないお金の出入りを、決まるまで置いておく科目
    summary: 出張前に渡す概算のお金は仮払金(資産)、正体の分からない入金は仮受金(負債)。内容が確定したら、本来の科目へ振り替えて仮の科目を消す。
    example: 出張に20,000円を仮払いし、帰ってから18,000円使ったと精算すれば、旅費交通費18,000円と現金2,000円の戻りになる。
    requires: [asset, liability]
    related: []
    contrasts: []
  - id: bad_debt
    name: 貸倒れ
    aliases: [貸し倒れ, 貸倒]
    reading: [かしだおれ]
    short: 売掛金などの「受け取る権利」が、相手の倒産などで回収できなくなること
    summary: 掛けで売った代金は、相手が倒産すると受け取れなくなることがある。回収できないと決まった売掛金は、もう財産ではないので帳簿から消し、その分を貸倒損失という費用にする。売った事実は変わらないので、売上は取り消さない。
    example: 30,000円分の豆を掛けで納めた事務所が倒産したら、売掛金30,000円を消して、貸倒損失30,000円を記録する。
    requires: [accounts_receivable, expense]
    related: [credit_transaction]
    contrasts: [returns]
  - id: allowance_for_doubtful_accounts
    name: 貸倒引当金
    reading: [かしだおれひきあてきん]
    short: 売掛金のうち回収できない見込みの金額を、前もって見積もって差し引いておく科目
    summary: 決算の日に、売掛金の残高に過去の実績の割合を掛けて貸倒れを見積もり、その金額を貸倒引当金として積む。売った年の売上と、その売上から出る貸倒れの損を同じ年にそろえるためにある。売掛金を直接は減らさず、資産のマイナス(評価勘定)として差し引いて見せる。
    example: 売掛金200,000円の2%が回収できないと見積もったら、貸倒引当金繰入4,000円(費用)を記録し、貸倒引当金4,000円を積む。
    requires: [bad_debt, contra_account, closing]
    related: [replenishment_method, accounts_receivable]
    contrasts: []
  - id: replenishment_method
    name: 差額補充法
    reading: [さがくほじゅうほう]
    short: 決算で、貸倒引当金の残高と今年の見積額の差だけを足したり戻したりする方法
    summary: 貸倒引当金に前の年の残高があるときは、見積額をまるごと積まず、残高を見積額に合わせるための差額だけを記帳する。足りなければ貸倒引当金繰入(費用)で足し、多ければ貸倒引当金戻入(収益)で戻す。
    example: 見積額が6,000円で残高が4,000円なら、2,000円だけを貸倒引当金繰入で足す。
    requires: [allowance_for_doubtful_accounts]
    related: []
    contrasts: []
