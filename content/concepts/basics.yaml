id: basics
title: 簿記の構造
order: 1
concepts:
  - id: bookkeeping
    name: 簿記
    reading: [ぼき]
    short: お店や会社のお金と物の動きを、決まった書き方で帳簿に記録する技術
    summary: 帳簿記入を縮めた言葉とされる。取引を決まった書き方で帳簿に記録し、いま何を持っていて、どれだけもうかったかを誰が見ても同じ数字で確かめられるようにする。記録の結果は貸借対照表と損益計算書にまとまる。
    example: カフェが家賃50,000円を現金で払ったら、その日のうちに「支払家賃50,000 / 現金50,000」と帳簿に書く。
    requires: []
    related: [account_books, book_entry, journal_entry]
    contrasts: []
  - id: account_books
    name: 帳簿
    reading: [ちょうぼ]
    short: お店や会社のお金と物の動きを書きとめておくノート
    summary: 取引を記録する帳面の総称。取引を起きた順に書く仕訳帳と、科目ごとに集め直す総勘定元帳が中心になる。紙のノートでも会計ソフトでも、書く内容は変わらない。
    example: カフェの1か月の取引を仕訳帳に書いていくと、同じ内容が総勘定元帳の現金や売上の欄にも載る。どちらも帳簿。
    requires: []
    related: [bookkeeping, journal, general_ledger]
    contrasts: []
  - id: book_entry
    name: 記帳
    reading: [きちょう]
    short: 取引を帳簿に書くこと
    summary: 起きた取引を帳簿に書き入れること。簿記では、取引を仕訳の形にして仕訳帳に書くところから始まる。記帳した内容が集まって、貸借対照表と損益計算書になる。
    example: コーヒーが80,000円売れたら、「現金80,000 / 売上80,000」と仕訳帳に書く。これが記帳。
    requires: [account_books]
    related: [journal_entry, journal]
    contrasts: []
  - id: transaction
    name: 取引
    reading: [とりひき]
    short: 会社の財産やもうけに変化を起こす出来事
    summary: 簿記でいう取引は、会社の資産・負債・純資産・収益・費用のどれかを変化させる出来事のこと。日常語の「取引」より広く、火事で建物を失うことも取引に含まれる一方、契約を結んだだけでお金や物が動かなければ取引ではない。
    example: 商品を売って現金を受け取るのは取引。得意先と来月納品する約束をしただけなら、まだ取引ではない。
    requires: []
    related: [journal_entry, five_elements]
    contrasts: []
  - id: five_elements
    name: 5要素
    reading: [ごようそ]
    short: 会社のお金の動きを分類する5つの箱。資産・負債・純資産・収益・費用
    summary: 簿記はすべての取引を、資産・負債・純資産(財産の状態を表す3つ)と収益・費用(もうけの中身を表す2つ)のどれかの変化として記録する。どの勘定科目もこの5つのどれかに属する。
    example: 現金は資産、借入金は負債、資本金は純資産、売上は収益、給料は費用。
    requires: []
    related: [asset, liability, equity, revenue, expense, balance_sheet, income_statement]
    contrasts: []
  - id: asset
    name: 資産
    reading: [しさん]
    short: 会社が持っている財産や、将来お金を受け取る権利
    summary: 現金や預金だけでなく、建物・備品・車両のような物、売掛金のような「後でお金を受け取る権利」も資産。会社が事業に使える経済的な価値の全体を指す。
    example: 現金100万円でトラックを買うと、現金という資産が減ってトラックという資産が増える。資産の合計は変わらない。
    requires: [five_elements]
    related: [liability, equity, balance_sheet]
    contrasts: [liability]
  - id: liability
    name: 負債
    reading: [ふさい]
    short: 将来、会社が支払わなければならない義務
    summary: 借入金や買掛金のように、将来お金を支払う(または物を引き渡す)義務。お金を借りると現金という資産が増えるが、同時に返す義務が負債として増えるので、会社のもうけにはならない。
    example: 銀行から300万円を借りると、普通預金(資産)が300万円増え、借入金(負債)が300万円増える。
    requires: [five_elements]
    related: [asset, equity]
    contrasts: [asset, expense]
  - id: equity
    name: 純資産
    reading: [じゅんしさん]
    short: 資産から負債を引いた残り。元手とこれまでのもうけ
    summary: 資産の合計から負債の合計を引いた金額。持ち主が出した元手(資本金)と、会社が稼いで残した利益の積み上がり(繰越利益剰余金)からなる。株式会社では、元手を出した持ち主を株主と呼ぶ。収益と費用の差である当期純利益は、最終的に純資産を増減させる。
    example: 資産1,000万円、負債400万円の会社の純資産は600万円。利益を100万円出すと純資産は700万円になる。
    requires: [asset, liability]
    related: [net_income, balance_sheet]
    contrasts: [liability]
  - id: revenue
    name: 収益
    reading: [しゅうえき]
    short: 事業によって会社の純資産を増やす原因。売上など
    summary: 商品を売る、サービスを提供するなどして、会社の純資産を増やす原因となるもの。現金を受け取ったかどうかではなく、純資産が増えたかどうかで判断する。借入による入金は負債も増えるので収益ではない。
    example: 商品を8万円で売れば、代金が現金でも掛け(後払い)でも売上という収益が8万円発生する。
    requires: [equity]
    related: [expense, net_income, income_statement]
    contrasts: [expense]
  - id: expense
    name: 費用
    reading: [ひよう]
    short: 収益を得るために使った犠牲。会社の純資産を減らす原因
    summary: 給料や家賃のように、事業を行うために消費した価値。純資産を減らす原因であり、損益計算書に載ってその期で消える。「将来支払う義務」である負債とは別物。
    example: 事務所の家賃5万円を払うと、現金(資産)が5万円減り、支払家賃(費用)が5万円発生する。
    requires: [equity]
    related: [revenue, net_income, income_statement]
    contrasts: [revenue, liability]
  - id: account_title
    name: 勘定科目
    reading: [かんじょうかもく]
    short: 取引を記録するときに使う、決まった名前のラベル
    summary: 現金、売掛金、売上のように、取引の内容を分類して記録するための名前。すべての勘定科目は5要素のどれかに属し、それによって借方・貸方のどちらで増えるかが決まる。
    example: 「事務所の家賃を払った」は支払家賃という勘定科目(費用)で記録する。
    requires: [five_elements]
    related: [journal_entry]
    contrasts: []
  - id: debit_credit
    name: 借方と貸方
    reading: [かりかたとかしかた, かりかた, かしかた]
    short: 仕訳の左側(借方)と右側(貸方)。どちらで増えるかは要素ごとに決まっている
    summary: 簿記ではすべての記録を左右2列に分けて書く。左を借方、右を貸方と呼ぶ。左右は読みの形で覚えられる。かりかたの「り」は左下へ払い、かしかたの「し」は右上へはねる。資産と費用は借方で増え、負債・純資産・収益は貸方で増える。これは貸借対照表で資産を左、負債と純資産を右に置く配置と同じ理屈に基づいている。
    example: 現金(資産)が増えたら借方に、借入金(負債)が増えたら貸方に書く。
    requires: [five_elements]
    related: [journal_entry, balance_sheet]
    contrasts: []
  - id: journal_entry
    name: 仕訳
    reading: [しわけ]
    short: 1つの取引を、借方と貸方に勘定科目と金額で書き分けた記録
    summary: 取引を「何がいくら増減したか」として、借方と貸方に勘定科目と金額を書く記録。1つの取引には「何が増減したか」という結果と、その原因という2つの面があり、両方を同じ金額で書くので、借方の合計と貸方の合計は常に一致する。
    example: 家賃5万円を現金で払った → 借方に支払家賃50,000、貸方に現金50,000。
    requires: [debit_credit, account_title, transaction]
    related: [balance_sheet, income_statement]
    contrasts: []
  - id: balance_sheet
    name: 貸借対照表
    reading: [たいしゃくたいしょうひょう]
    short: ある時点で会社が何を持ち、何を負っているかを一覧にした表
    summary: 決算日時点の資産・負債・純資産を並べた表。左に資産、右に負債と純資産を置き、左右の合計は必ず一致する(資産 = 負債 + 純資産)。会社の財産の状態を表す。
    example: 資産1,000万円、負債400万円、純資産600万円なら、左右とも1,000万円で一致する。
    requires: [asset, liability, equity]
    related: [income_statement]
    contrasts: [income_statement]
  - id: income_statement
    name: 損益計算書
    reading: [そんえきけいさんしょ]
    short: ある期間にどれだけもうけたかを、収益と費用で示した表
    summary: 一定期間(通常1年)の収益と費用を並べ、その差として当期純利益を示す表。会社の成績を表す。ここで計算された利益は貸借対照表の純資産を増やす。
    example: 売上800万円、費用の合計700万円なら、当期純利益は100万円。
    requires: [revenue, expense]
    related: [balance_sheet, net_income]
    contrasts: [balance_sheet]
  - id: net_income
    name: 当期純利益
    aliases: [当期純損失]
    reading: [とうきじゅんりえき]
    short: 一定期間(通常1年)の収益から費用を引いた、最終的なもうけ。費用のほうが多くてマイナスになったときは当期純損失と呼ぶ
    summary: 収益の合計から費用の合計を引いた金額。損益計算書の結論であり、貸借対照表の純資産を同じ金額だけ増やす。費用が増えれば当期純利益は減り、純資産も減る。費用のほうが多いときはマイナスになり、当期純損失と呼ぶ。
    example: 売上80万円、支払家賃5万円だけなら、当期純利益は75万円。
    requires: [revenue, expense, equity]
    related: [income_statement, balance_sheet]
    contrasts: []
  - id: journal
    name: 仕訳帳
    reading: [しわけちょう]
    short: 仕訳を、取引の起きた順に書いていく帳簿
    summary: 取引が起きるたびに、日付の順に仕訳を書く帳簿。いつ何が起きたかを順にたどれる。科目ごとの増減や残高はここからは読みにくいので、同じ内容を総勘定元帳へ科目ごとに写して確かめる。
    example: 出資、マシンの購入、借入、売上、家賃の支払いを記帳すると、仕訳帳にはこの5つの仕訳が起きた順に並ぶ。
    requires: [journal_entry, account_books]
    related: [general_ledger, book_entry]
    contrasts: [general_ledger]
  - id: t_account
    name: T勘定
    reading: [てぃーかんじょう]
    short: 科目ごとに左右の増減を並べた帳簿の形
    summary: 仕訳帳は取引を起きた順に書くが、T勘定は同じ仕訳を勘定科目ごとに集め直す。仕訳で左に書いた金額は科目の左側に、右に書いた金額は右側に載り、左右の差がその科目の残高になる。全科目のT勘定を集めた帳簿を総勘定元帳と呼ぶ。
    example: 現金1,000,000の出資と家賃50,000の支払いを記帳すると、現金のT勘定は左に1,000,000、右に50,000が載り、残高は950,000。
    requires: [journal_entry, account_title]
    related: [debit_credit, general_ledger, balance]
    contrasts: []
  - id: general_ledger
    name: 総勘定元帳
    aliases: [元帳]
    reading: [そうかんじょうもとちょう]
    short: すべての勘定科目のT勘定を集めた帳簿。科目ごとの増減と残高が分かる
    summary: 仕訳帳に書いた仕訳を、勘定科目ごとのページに写して集めた帳簿。元帳とも呼ぶ。仕訳帳が「いつ何が起きたか」を示すのに対し、総勘定元帳は「現金はいまいくらあるか」のように科目ごとの増減と残高を示す。貸借対照表と損益計算書は、この帳簿の各科目の残高から作る。
    example: 「現金50,000 / 売上50,000」と記帳すると、総勘定元帳では現金のページの左と売上のページの右に50,000が載る。
    requires: [t_account, journal]
    related: [balance, account_books]
    contrasts: [journal]
  - id: balance
    name: 残高
    reading: [ざんだか]
    short: ある勘定科目の左の合計と右の合計の差。その科目にいま残っている金額
    summary: 勘定科目ごとに、借方(左)の合計と貸方(右)の合計を比べた差額。現金なら、入ってきた金額の合計から出ていった金額の合計を引いた、いま手元にあるはずの金額になる。貸借対照表と損益計算書には、各科目の残高が載る。
    example: 現金の左に1,000,000と300,000、右に600,000と50,000が載っていれば、現金の残高は650,000。
    requires: [t_account]
    related: [general_ledger, debit_credit]
    contrasts: []
  - id: closing
    name: 決算
    reading: [けっさん]
    short: 期末に帳簿を締めて財務諸表を作る手続き
    summary: 会社は通常1年を区切り(期)にして、その最後の日に帳簿を締める。期中の記録を確かめて直し、その期のもうけを損益計算書に、期末の財産と義務を貸借対照表にまとめる。
    example: 4月から3月を1期とするカフェなら、3月31日が決算の日。その日までの記録から、1年分の当期純利益と期末の資産・負債・純資産を求める。
    requires: [balance_sheet, income_statement]
    related: [net_income]
    contrasts: []
  - id: financial_statements
    name: 財務諸表
    aliases: [決算書]
    reading: [ざいむしょひょう]
    short: 貸借対照表と損益計算書など、会社の財産ともうけを外に報告する表をまとめた呼び名
    summary: 帳簿の記録を決算でまとめ、会社の状態を報告するための表の総称。中心は、ある時点の資産・負債・純資産を示す貸借対照表と、ある期間の収益・費用ともうけを示す損益計算書。一般には決算書とも呼ばれる。
    example: カフェの1年の記帳を決算でまとめると、3月31日時点の貸借対照表と、1年分の損益計算書ができる。この2つが財務諸表。
    requires: [balance_sheet, income_statement]
    related: [closing]
    contrasts: []
  - id: accounting_period
    name: 会計期間
    aliases: [期]
    reading: [かいけいきかん]
    short: もうけを計算するために区切った期間。ほとんどの会社が1年にしていて、初めを期首、終わりを期末、その間を期中と呼ぶ
    summary: 会社は続いていくので、期間を区切らないともうけを計算できない。この区切りが会計期間で、ほとんどの会社が1年にしている。期間の最初の日を期首、最後の日を期末(決算の日)、その間を期中と呼ぶ。いまの期間を当期、1つ前を前期、1つ後を次期と呼ぶ。
    example: 4月1日から3月31日を1期とするカフェなら、4月1日が期首、3月31日が期末。6月の取引は期中の取引。
    requires: []
    related: [closing, net_income]
    contrasts: []
  - id: accrual_basis
    name: 発生主義
    reading: [はっせいしゅぎ]
    short: お金を払った時ではなく、その効果が生じた期間に収益や費用を記録する考え方
    summary: 現金の出入りの時点ではなく、収益や費用の原因となる事実が発生した期間に記録する原則。長く使う資産を買った時に全額を費用にせず、使う期間に分けて費用にするのも発生主義から導かれる。
    example: 3月に働いてもらった給料を4月に払っても、給料という費用は3月の分として記録する。
    requires: [expense, revenue]
    related: [cost_allocation]
    contrasts: []
