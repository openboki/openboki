# よくある誤解。演習の誤答パターンから参照され、立ち止まり(remediation)の案内先になる
misconceptions:
  - id: debit_means_increase
    name: 借方は常に増加
    description: 「借方 = 増える、貸方 = 減る」と覚えている。資産と費用では正しいが、負債・純資産・収益では逆になる
    correct: 増減の側は要素によって決まる。資産・費用は借方で増え、負債・純資産・収益は貸方で増える
    concepts: [five_elements, debit_credit]
    remediation: bookkeeping-basics/five-elements
  - id: outflow_on_debit
    name: お金が出ていく側を左に書く
    description: 減る科目や払う科目を左(借方)、増える科目や受け取る科目を右(貸方)に書くと思っている。資産と費用は左で増え、右で減るので、向きが逆になる
    correct: 左(借方)は増えた資産や費用、右(貸方)は減った資産。お金が出ていく(減る)現金や預金は右に書き、代わりに増えた資産や費用を左に書く
    concepts: [debit_credit, journal_entry]
    remediation: bookkeeping-basics/five-elements
  - id: cash_is_only_asset
    name: 資産は現金だけ
    description: 現金や預金だけを資産と考え、建物や備品、売掛金のような形の違う財産を資産とみなしていない
    correct: 資産とは会社が持つ財産や権利の全体。現金が形を変えて建物や備品になっても、資産の合計は変わらない
    concepts: [asset, five_elements]
    remediation: bookkeeping-basics/five-elements
  - id: revenue_equals_cash_in
    name: お金が入れば収益
    description: 現金が入ってくれば収益、出ていけば費用だと思っている。借入による入金を収益と考えてしまう
    correct: 収益は純資産を増やす原因、費用は純資産を減らす原因。借入は返す義務(負債)が同時に増えるので純資産は増えず、収益ではない
    concepts: [revenue, liability, five_elements]
    remediation: bookkeeping-basics/five-elements
  - id: expense_as_liability
    name: 費用と負債の混同
    description: 「支払うもの」という共通点から、費用と負債を同じものだと考えている
    correct: 負債は「将来支払う義務」で貸借対照表に残る。費用は「純資産を減らす原因」で損益計算書に載り、その期で消える
    concepts: [expense, liability]
    remediation: bookkeeping-basics/five-elements
  - id: capital_loan_confused
    name: 元手と借入金の混同
    description: お店に入ったお金はどれも同じだと考えて、自分が出した元手を借入金と書いたり、銀行から借りたお金を資本金と書いたりしてしまう
    correct: 借入金は、いつか返す義務があるお金。資本金は、持ち主が事業のために出した元手で、返す義務がない。「返す必要があるか」で見分ける
    concepts: [equity, liability, five_elements]
    remediation: bookkeeping-basics/five-elements
  - id: payment_reduces_capital
    name: お金を払うと元手が減る
    description: お金が出ていくと元手がそのまま減ると考えて、費用として書かずに資本金を減らしてしまう
    correct: 資本金は持ち主が出した元手の金額で、支払いでは書き換えない。使ったお金は費用として記録し、費用の分だけ当期純利益が減ることで純資産が減る
    concepts: [expense, equity]
    remediation: bookkeeping-basics/five-elements
  - id: sale_proceeds_as_capital_or_loan
    name: 売上の代金を元手や借入金と書く
    description: お店に入ったお金の出どころを区別せず、商品を売って受け取った代金まで資本金や借入金として記録してしまう
    correct: 資本金は持ち主が出した元手、借入金は返す義務があるお金、売上は商品を売って得た返す必要のないお金。「何によって入ったお金か」で見分ける
    concepts: [revenue, equity, liability]
    remediation: bookkeeping-basics/five-elements
  - id: expense_at_payment
    name: 支払った時に費用
    description: 現金を支払った時点で費用になると思っている。支払いと費用の発生を区別していない
    correct: 費用はお金を払った時ではなく、その効果が発生した期間に計上する。長く使う資産の購入は支払った時点では費用にならない
    concepts: [accrual_basis, cost_allocation]
    remediation: depreciation/what-is-depreciation
  - id: no_cost_allocation
    name: 購入時に全額費用
    description: 長く使う資産の購入額を、買った期の費用に全額計上してしまう
    correct: 使う期間にわたって費用を配分する(費用配分の原則)。購入した期は資産として記録し、各期の減価償却費として少しずつ費用にする
    concepts: [cost_allocation, depreciation]
    remediation: depreciation/what-is-depreciation
  - id: contra_as_liability
    name: 減価償却累計額は負債
    description: 減価償却累計額が貸方に増えることから、負債だと思っている
    correct: 減価償却累計額は資産のマイナスを表す評価勘定。誰かに支払う義務ではないので負債ではなく、貸借対照表では資産から控除して表示する
    concepts: [contra_account, indirect_method]
    remediation: depreciation/what-is-depreciation
  - id: accumulated_depreciation_any_asset
    name: 累計額はどの資産の分でもよい
    description: 減価償却累計額は資産の種類を問わず、建物・車両・備品のどの累計額に積んでも同じだと思っている
    correct: 累計額は資産ごとに分けて積み、その資産の取得原価から引いて帳簿価額を出す。備品の減りは備品減価償却累計額に積み、建物や車両の累計額には混ぜない
    concepts: [contra_account, book_value]
    remediation: depreciation/what-is-depreciation
  - id: contra_increase_as_asset_increase
    name: 累計額が増えると資産が増える
    description: 減価償却累計額の金額が増えるのを見て、資産の合計も増えると思っている
    correct: 減価償却累計額は資産のマイナスを表す評価勘定。累計額が増えるほど差し引く金額が大きくなり、資産の合計は減る
    concepts: [contra_account, indirect_method]
    remediation: depreciation/what-is-depreciation
  - id: direct_writeoff_vs_contra
    name: 資産を直接減らす
    description: 間接法と指定されているのに、建物や備品の勘定科目を直接減らしてしまう
    correct: 間接法では固定資産の金額は取得原価のまま残し、減った分は減価償却累計額に積み上げる。これで取得原価と減価の累計の両方が読み取れる
    concepts: [indirect_method, contra_account]
    remediation: depreciation/what-is-depreciation
  - id: depreciation_as_cash_outflow
    name: 減価償却費は支払い
    description: 減価償却費を計上するときに現金や預金が減ると思っている
    correct: 現金は資産を買った時点で減っている。減価償却はその支出を各期に配分する手続きであり、お金の動きを伴わない
    concepts: [depreciation, cost_allocation]
    remediation: depreciation/what-is-depreciation
  - id: depreciation_as_supplies_expense
    name: 使った分は消耗品費
    description: 長く使う資産の使った分を、使って減ったものという連想から消耗品費として記録してしまう
    correct: 消耗品費はすぐ使い切る物の費用。何年も使う資産の、その期に使った分は減価償却費として記録する
    concepts: [depreciation, cost_allocation]
    remediation: depreciation/what-is-depreciation
  - id: forgot_monthly_proration
    name: 月割りを忘れる
    description: 期の途中で取得した資産でも、1年分の減価償却費を計上してしまう
    correct: 使った期間に対応する費用だけを計上する。取得した月から決算月までの月数で1年分を按分する
    concepts: [monthly_proration, straight_line_method]
    remediation: depreciation/straight-line
  - id: residual_value_ignored
    name: 残存価額を無視する
    description: 残存価額が与えられているのに、取得原価をそのまま耐用年数で割ってしまう
    correct: 配分するのは取得原価から残存価額を引いた金額。残存価額は使い終わった後に残る価値なので費用にしない
    concepts: [residual_value, straight_line_method]
    remediation: depreciation/straight-line
  - id: vehicle_is_equipment
    name: 車も備品
    description: 長く使う資産をまとめて備品と考え、配達用の車まで備品として記録してしまう
    correct: 車は車両運搬具という別の勘定科目。備品も車両運搬具も有形固定資産だが、何を買ったかで科目を分ける
    concepts: [tangible_fixed_assets, account_title]
    remediation: depreciation/straight-line
  - id: purchase_is_asset
    name: 仕入は資産
    description: 売るための商品を買ったとき、備品と同じように資産として記録すると思っている
    correct: 三分法では、商品を買ったときは「仕入」という費用で記録する。売れ残った分だけを決算で繰越商品(資産)に移す
    concepts: [three_account_method, purchase, expense]
    remediation: merchandise/three-account-method
  - id: revenue_only_when_cash
    name: お金を受け取るまで売上ではない
    description: 商品を渡しても、代金を受け取るまでは売上にならないと思っている
    correct: 売上は商品を渡した(サービスを提供した)ときに記録する。代金が後払いなら、受け取る権利を売掛金(資産)として記録する
    concepts: [credit_transaction, accounts_receivable, revenue]
    remediation: merchandise/credit-transactions
  - id: receivable_is_cash
    name: 売掛金は現金
    description: 売掛金を、すでに受け取ったお金や売上そのものと混同している
    correct: 売掛金は「後で代金を受け取る権利」で、現金とは別の資産。回収したときに現金や預金に変わる
    concepts: [accounts_receivable, asset]
    remediation: merchandise/credit-transactions
  - id: deposit_is_cash
    name: 現金と普通預金の取り違え
    description: 銀行の口座で動いたお金を「現金」と書いたり、手元の現金で払ったのに「普通預金」と書いたりして、2つの科目を区別しない
    correct: 現金は手元の通貨、普通預金は銀行の口座の残高で、別の勘定科目。口座への振り込みや口座からの支払いで動くのは普通預金で、手元の現金は動かない
    concepts: [asset, account_title]
    remediation: merchandise/credit-transactions
  - id: receivable_payable_confused
    name: 売掛金と買掛金の取り違え
    description: 名前が似ている売掛金と買掛金を、どちらがどちらか逆に使ってしまう
    correct: 売掛金は商品を売って後で代金を受け取る権利(資産)、買掛金は商品を仕入れて後で代金を払う義務(負債)。「売ったのか、買ったのか」で見分ける
    concepts: [accounts_receivable, accounts_payable]
    remediation: merchandise/credit-transactions
  - id: receivable_collection_is_sale
    name: 回収のときにもう一度売上
    description: 売掛金や未収入金を回収したときに、売上をもう一度記録してしまう
    correct: 代金を受け取る権利(売掛金・未収入金)は、売ったときに記録済み。回収では権利(資産)が現金や預金(資産)に変わるだけで、売上は増えない
    concepts: [accounts_receivable, revenue]
    remediation: merchandise/credit-transactions
  - id: payable_payment_is_purchase
    name: 支払いのときにもう一度仕入
    description: 買掛金を支払ったときに、仕入をもう一度記録してしまう
    correct: 仕入は商品を受け取ったときに記録済み。支払いでは買掛金(負債)が減り、現金(資産)が減るだけで、仕入は増えない
    concepts: [accounts_payable, purchase]
    remediation: merchandise/credit-transactions
  - id: return_as_new_transaction
    name: 返品を新しい取引として記録
    description: 返品を、新しい仕入や売上、あるいは別の費用や収益として記録してしまう
    correct: 返品は元の取引を取り消すこと。元の仕訳を左右逆にした仕訳(逆仕訳)で、仕入や売上、買掛金や売掛金を減らす
    concepts: [returns, journal_entry]
    remediation: merchandise/returns-and-costs
  - id: incidental_cost_separate
    name: 仕入の運賃を別の費用にする
    description: 商品を仕入れるときにかかった運賃を、仕入とは別の費用として記録してしまう
    correct: お店が負担する、商品を手に入れるまでにかかった運賃(仕入諸掛)は、商品の値段の一部として仕入に含める
    concepts: [incidental_costs, purchase]
    remediation: merchandise/returns-and-costs
  - id: shipping_in_purchases
    name: 発送費を仕入に含める
    description: 売った商品を送る運賃を、仕入に含めてしまう
    correct: お店が負担する売るときの運賃は発送費という費用。仕入に含めるのは、仕入れるときにかかった運賃だけ
    concepts: [incidental_costs, expense]
    remediation: merchandise/returns-and-costs
  - id: shipping_mixed_into_sale
    name: 売るときの運賃を代金に混ぜる
    description: 売った商品を送るためにお店が払った運賃を、売上や売掛金に足して、商品の代金の一部として記録してしまう
    correct: 売上と売掛金は商品の代金のまま。お店が負担する運賃は発送費という費用にして、別の行に書く
    concepts: [incidental_costs, expense]
    remediation: merchandise/returns-and-costs
  - id: purchases_equal_cogs
    name: 仕入の合計がそのまま売上原価
    description: 1年に仕入れた金額の全部が、売った商品の原価だと思っている
    correct: 売れ残った商品の分は、まだ費用ではない。期首の商品と仕入の合計から期末の商品を引いた金額が売上原価で、売れ残りは繰越商品(資産)として次の期に持ち越す
    concepts: [cost_of_goods_sold, ending_inventory]
    remediation: merchandise/cost-of-goods-sold
  - id: beginning_inventory_forgotten
    name: 期首の商品を売上原価に入れ忘れる
    description: 前の期から持ち越した商品(期首の商品)を忘れ、この期の仕入から売れ残りを引いただけで売上原価を求めてしまう
    correct: 期首の商品もこの期に売る商品の一部。売上原価は期首の商品 + 当期の仕入 − 期末の売れ残りで、決算では「仕入 / 繰越商品」で期首の商品を仕入に入れてから売れ残りを取り出す
    concepts: [cost_of_goods_sold, ending_inventory]
    remediation: merchandise/cost-of-goods-sold
  - id: inventory_transfer_as_transaction
    name: 繰越商品の振替を売買と思う
    description: 繰越商品と仕入の間で金額を移す振替を、お金の支払いや受け取り、商品の販売だと思い、現金や売上を使ってしまう
    correct: 振替は帳簿の中で金額を別の科目へ移すだけで、外との取引はない。現金も売上も動かない
    concepts: [ending_inventory, three_account_method]
    remediation: merchandise/cost-of-goods-sold
  - id: credit_purchase_paid_in_cash
    name: 掛けで買っても現金が減る
    description: 商品を掛けで仕入れたときに、代金をまだ払っていないのに現金の減少として記録してしまう
    correct: 掛けは代金を後で払う約束。仕入れた時点では現金は動かず、後で払う義務を買掛金(負債)として記録する
    concepts: [accounts_payable, purchase]
    remediation: merchandise/credit-transactions
  - id: shortage_is_loss
    name: 足りない分はすぐ費用
    description: 金庫の現金が帳簿より少ないと分かった時点で、差額をそのまま雑損などの費用にしてしまう
    correct: 期中(決算の日より前)に分かった差額は、まず現金過不足という仮の置き場に入れ、原因を調べる。記帳漏れが見つかれば本来の科目へ移し、決算まで分からなかった分だけが雑損になる
    concepts: [cash_over_and_short, miscellaneous_loss_gain]
    remediation: cash-and-deposits/cash-over-and-short
  - id: unknown_shortage_as_known_expense
    name: 原因不明の分も分かった費用と同じ科目にする
    description: 決算まで原因が分からなかった不足を、原因が分かった分と同じ通信費などの科目に振り替えてしまう
    correct: 本来の科目へ移せるのは原因が分かった分だけ。決算まで原因が分からなかった不足は雑損にする
    concepts: [cash_over_and_short, miscellaneous_loss_gain]
    remediation: cash-and-deposits/cash-over-and-short
  - id: shortage_is_gain
    name: 足りない分を雑益にする
    description: 決算まで原因が分からなかった現金の不足を、雑益(収益)に振り替えてしまう
    correct: 現金が足りなかったのなら損なので雑損(費用)、多かったのなら得なので雑益(収益)。不足は現金過不足の左に預けてあるので、右に書いて消し、左に雑損を書く
    concepts: [cash_over_and_short, miscellaneous_loss_gain]
    remediation: cash-and-deposits/cash-over-and-short
  - id: shortage_transfer_moves_money
    name: 雑損への振り替えでお金が動く
    description: 現金過不足を雑損へ振り替える手続きを支払いと考えて、預金などのお金を減らしてしまう
    correct: 不足した現金は差額が分かったときに帳簿から減らしてある。決算の振り替えは帳簿の中で現金過不足を雑損へ移すだけで、お金は動かない
    concepts: [cash_over_and_short, miscellaneous_loss_gain]
    remediation: cash-and-deposits/cash-over-and-short
  - id: check_is_cash
    name: 小切手を渡したら現金が減る
    description: 小切手を振り出して支払うと、手元の現金が減ると考えている
    correct: 自分が振り出した小切手は当座預金から引き落とされるので、減るのは当座預金。逆に、他人が振り出した小切手を受け取ったときは、すぐ換金できるので現金として扱う
    concepts: [check, checking_account]
    remediation: cash-and-deposits/checking-account
  - id: issued_check_leaves_payable
    name: 小切手を渡しても支払いは済んでいない
    description: 小切手は後で引き落とされるので、振り出しただけでは支払いが済まず、買掛金が残る(増える)と考えている
    correct: 小切手を渡した時点で支払いは済んでいる。代金を後で払う約束(買掛金)は残らず、振り出した分だけ当座預金(資産)が減る
    concepts: [check, accounts_payable]
    remediation: cash-and-deposits/checking-account
  - id: received_check_is_checking_account
    name: 受け取った小切手は預金
    description: 他人が振り出した小切手を受け取ると、自分の当座預金や普通預金が増えると思っている
    correct: 他人が振り出した小切手は、銀行に持っていけばすぐお金に換えられるので現金として扱う。受け取っただけではまだ銀行に入れていない。当座預金を使うのは、自分が小切手を振り出すとき
    concepts: [check, checking_account]
    remediation: cash-and-deposits/checking-account
  - id: overdraft_is_deposit
    name: 当座借越も預金の仲間
    description: 当座借越に「当座」と付いているので、預金(資産)の一種だと考えている
    correct: 当座借越は、残高を超えて振り出した小切手を銀行が立て替えた金額。返す義務なので負債
    concepts: [bank_overdraft, liability]
    remediation: cash-and-deposits/checking-account
  - id: deposit_kinds_confused
    name: 預金はどれも同じ科目
    description: 当座預金と普通預金を区別せず、どちらも「預金」として同じ科目で記録してしまう
    correct: 普通預金と当座預金は別の口座で、別の勘定科目。普通預金から当座預金へ移したら、増える当座預金が左、減る普通預金が右
    concepts: [checking_account, account_title]
    remediation: cash-and-deposits/checking-account
  - id: petty_cash_is_expense
    name: 渡した時点で費用
    description: 担当者に小口現金を渡したときに、その金額を費用として記録してしまう
    correct: 渡しただけでは会社のお金が担当者の手元に移っただけ。実際に支払われた分の報告を受けたときに、使い道ごとの費用になる
    concepts: [petty_cash, imprest_system]
    remediation: cash-and-deposits/petty-cash
  - id: petty_cash_is_cash
    name: 小口現金も金庫の現金と同じ
    description: 担当者に渡した小口現金を、店の金庫のお金と同じ「現金」の科目で記録してしまう
    correct: 担当者の手元のお金は、金庫の現金とは分けて小口現金という科目で管理する。前渡しでは小口現金が増え、使った分の報告を受けたら小口現金が減る
    concepts: [petty_cash]
    remediation: cash-and-deposits/petty-cash
  - id: petty_expenses_lumped
    name: 使い道が違っても1つの費用にまとめてよい
    description: 担当者から報告された使い道の違う支払いを、合計して1つの費用の科目で記録してしまう
    correct: 費用は使い道ごとの科目で記録する。切手代は通信費、文房具代は消耗品費、電車代は旅費交通費のように分ける
    concepts: [petty_cash, expense]
    remediation: cash-and-deposits/petty-cash
  - id: petty_payment_omitted
    name: 報告された支払いの一部だけを記録する
    description: 担当者から報告された複数の支払いのうち一部を書き忘れ、小口現金の減少もその分だけで記録してしまう
    correct: 報告された支払いはすべて費用になり、小口現金はその合計だけ減る。報告の内訳と仕訳の行を1つずつ突き合わせる
    concepts: [petty_cash, expense]
    remediation: cash-and-deposits/petty-cash
  - id: petty_report_as_replenishment
    name: 報告のときに当座預金を減らす
    description: 担当者から支払いの報告を受けただけなのに、補給の小切手も一緒に振り出したものとして、小口現金ではなく当座預金を減らしてしまう
    correct: 報告で減るのは担当者の手元の小口現金。当座預金が減るのは、使った分を小切手で補給するとき。報告と同時に補給する場合だけ、費用の相手を当座預金にする
    concepts: [petty_cash, imprest_system, checking_account]
    remediation: cash-and-deposits/petty-cash
  - id: postage_as_supplies
    name: 切手代も消耗品費
    description: 切手も文房具と同じように店で買う物なので、切手代を消耗品費で記録してしまう
    correct: 切手代は郵便を送るための代金なので通信費。消耗品費は、文房具のように使ってなくなる物の代金。費用の科目は買った物の形ではなく使い道で決める
    concepts: [expense, account_title]
    remediation: cash-and-deposits/petty-cash
  - id: asset_transfer_changes_total
    name: 資産の中の移動で合計が動く
    description: 当座預金から小口現金へのように資産の中でお金が移っただけなのに、片方の増減だけを見て資産の合計が増えた(減った)と考えている
    correct: 資産から資産への移動は、増える科目と減る科目が同じ金額なので資産の合計は変わらない。左右の科目がどの要素かを両方見てから、合計がどう動くかを考える
    concepts: [asset, five_elements]
    remediation: bookkeeping-basics/five-elements
  - id: imprest_balance_not_restored
    name: 補給しても定額に戻らない
    description: 定額資金前渡法で補給したあとの小口現金を、補給前の残高のままか、渡した金額に補給分を足した金額だと考えている
    correct: 補給するのは使った分だけなので、小口現金は渡したときの定額に戻る。補給後の残高はいつも定額と同じ
    concepts: [imprest_system, petty_cash]
    remediation: cash-and-deposits/petty-cash
  - id: lender_borrower_confused
    name: 貸付金と借入金の取り違え
    description: 貸した側と借りた側を逆に捉えて、貸付金と借入金を入れ替えて使ってしまう
    correct: 貸付金は貸したお金を後で返してもらう権利(資産)、借入金は借りたお金を後で返す義務(負債)。「自分は貸したのか、借りたのか」で見分ける
    concepts: [loan, asset, liability]
    remediation: receivables-and-payables/loans
  - id: interest_income_expense_confused
    name: 受取利息と支払利息の取り違え
    description: 利息を払ったのに受取利息と書くなど、利息をもらう側と払う側を逆にしてしまう
    correct: 受取利息は貸した側がもらう収益、支払利息は借りた側が払う費用。「自分はもらったのか、払ったのか」で見分ける
    concepts: [interest, revenue, expense]
    remediation: receivables-and-payables/loans
  - id: interest_months_not_divided
    name: 月数をそのまま掛ける
    description: 年利に月数をそのまま掛けて、利息を実際の何倍にも計算してしまう
    correct: 年利は1年分の率。利息は 元本 × 年利率 × 月数 ÷ 12で、月数は12で割って年に直してから掛ける
    concepts: [interest]
    remediation: receivables-and-payables/loans
  - id: percent_off_by_ten
    name: "%を小数に直すときの桁違い"
    description: 2%を0.2と読むように、%を小数に直すときに桁を1つ間違えて、利息を10倍に計算してしまう
    correct: 1%は100分の1。2%は2 ÷ 100 = 0.02で、0.2なら20%になる。小数に直したら、1%が0.01になっているかで確かめる
    concepts: [interest]
    remediation: receivables-and-payables/loans
  - id: expense_as_negative_amount
    name: 払う金額にマイナスを付ける
    description: お金が出ていくことを表そうとして、利息のように払う金額にマイナスの符号を付けて答えてしまう
    correct: 金額は払う額そのもので、符号は付けない。お金が出ていくことは、仕訳で普通預金を右(貸方)に書くことで表す
    concepts: [interest, expense]
    remediation: receivables-and-payables/loans
  - id: interest_is_loan_return
    name: 利息も貸したお金の戻り
    description: 受け取った利息を、貸付金が戻ってきた分として貸付金を減らしてしまう
    correct: 利息は貸したことで得られたもうけ(受取利息という収益)。元本の返済とは別に記録する
    concepts: [interest, loan]
    remediation: receivables-and-payables/loans
  - id: interest_reduces_principal
    name: 利息を払うと借入金が減る
    description: 支払った利息の分だけ借入金(元本)が減ると考えている
    correct: 利息は借りているための費用(支払利息)。元本は返済したときだけ減る
    concepts: [interest, loan]
    remediation: receivables-and-payables/loans
  - id: principal_is_revenue
    name: 返してもらったお金は収益
    description: 貸付金の元本が返ってきたときに、入金を収益として記録してしまう
    correct: 元本の返済は「返してもらう権利(貸付金)」が預金に形を変えただけで、もうけではない。収益になるのは利息だけ
    concepts: [loan, revenue]
    remediation: receivables-and-payables/loans
  - id: repayment_includes_interest
    name: 元本の返済に利息を足す
    description: 貸付金の元本が返ってきたときに、別の入金である利息も一緒に受け取ったものとして記録してしまう
    correct: 利息は受け取ったときに記録する別の入金で、元本の返済では貸付金と預金だけが動く
    concepts: [interest, loan]
    remediation: receivables-and-payables/loans
  - id: repayment_is_expense
    name: 返済は費用
    description: 借入金を返したときに、出ていったお金を費用として記録してしまう
    correct: 返済は「返す義務(借入金)」と預金が同じだけ減る取引で、もうけは変わらない。費用になるのは利息だけ
    concepts: [loan, expense]
    remediation: receivables-and-payables/loans
  - id: nontrade_as_trade
    name: 後払いなら何でも売掛金・買掛金
    description: 商品以外の物(備品など)を後払いで売り買いしたときにも、売掛金や買掛金を使ってしまう
    correct: 売掛金と買掛金は商品の売買専用。それ以外の物の代金は未収入金・未払金で記録し、本業の取引と区別する
    concepts: [non_trade_receivable_payable, accounts_receivable, accounts_payable]
    remediation: receivables-and-payables/other-receivables-and-payables
  - id: trade_as_nontrade
    name: 商品の後払いも未収入金・未払金
    description: 商品を後払いで売り買いしたときに、売掛金や買掛金ではなく未収入金や未払金を使ってしまう
    correct: 商品の売買の代金は売掛金・買掛金で記録する。未収入金・未払金は商品以外の物の代金にだけ使う
    concepts: [non_trade_receivable_payable, accounts_receivable, accounts_payable]
    remediation: receivables-and-payables/other-receivables-and-payables
  - id: nontrade_receivable_payable_confused
    name: 未収入金と未払金の取り違え
    description: 名前が似ているため、後で受け取る権利の未収入金と、後で払う義務の未払金を取り違えてしまう
    correct: 未収入金は後で受け取る権利なので資産、未払金は後で払う義務なので負債。代金を受け取る側か払う側かで決まる
    concepts: [non_trade_receivable_payable, asset, liability]
    remediation: receivables-and-payables/other-receivables-and-payables
  - id: asset_sale_is_sales
    name: 備品を売ったら売上
    description: 使っていた備品を売ったときに、代金を売上として記録してしまう
    correct: 売上は商品を売ったときだけ。備品を売ったときは、備品(資産)そのものを減らす
    concepts: [non_trade_receivable_payable, revenue]
    remediation: receivables-and-payables/other-receivables-and-payables
  - id: advance_is_expense
    name: 手付金を払ったら仕入
    description: 商品を受け取る前に払った手付金を、その時点で仕入(費用)にしてしまう
    correct: 商品を受け取るまでは前払金(資産)。商品が届いたときに仕入へ振り替える
    concepts: [advance_payment_receipt, purchase]
    remediation: receivables-and-payables/other-receivables-and-payables
  - id: advance_payment_as_receivable
    name: 払った手付金は未収入金
    description: 商品を受け取る前に払った手付金を、後で代金を受け取る権利と考えて未収入金にしてしまう
    correct: 未収入金は商品以外の物を売った代金を受け取る権利。手付金は先に払って商品を受け取る権利なので前払金で記録する
    concepts: [advance_payment_receipt, non_trade_receivable_payable]
    remediation: receivables-and-payables/other-receivables-and-payables
  - id: advance_not_cleared_on_receipt
    name: 手付金を消さずに買掛金を全額にする
    description: 商品が届いたときに手付金を差し引かず、代金の全額を買掛金にして、前払金を資産に残したままにしてしまう
    correct: 商品が届いたら前払金は貸方に書いて消す。買掛金にするのは手付金を差し引いた残りだけ。全額にすると払った分まで負債に載る
    concepts: [advance_payment_receipt, liability]
    remediation: receivables-and-payables/other-receivables-and-payables
  - id: advance_received_is_revenue
    name: 手付金を受け取ったら売上
    description: 商品を渡す前に受け取った手付金を、その時点で売上(収益)にしてしまう
    correct: 商品を渡すまでは前受金(負債)。渡せなければ返す義務がある。商品を渡したときに売上へ振り替える
    concepts: [advance_payment_receipt, revenue]
    remediation: receivables-and-payables/other-receivables-and-payables
  - id: net_pay_is_salary
    name: 手取りが給料
    description: 従業員に実際に振り込んだ手取り額を給料(費用)として記録してしまう
    correct: 給料は税金などを差し引く前の総額。差し引いた分は預り金として、後で本人の代わりに納める
    concepts: [advances_and_deposits, expense]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: withholding_ignored
    name: 天引きを記録しない
    description: 給料から差し引いた税金を記録せず、総額をそのまま振り込んだことにしてしまう
    correct: 振り込むのは差し引いた後の手取り。差し引いた分は店のお金ではなく、本人の代わりに納めるまで預かっている義務なので預り金(負債)にする
    concepts: [advances_and_deposits, liability]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: deposit_received_is_asset
    name: 預かったお金は店の資産
    description: 預かったお金を店の手元に増えたものと考えて、預り金を借方(左)に書いてしまう
    correct: 預り金は後で納める義務なので負債。増えるときは貸方(右)に書く
    concepts: [advances_and_deposits, liability]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: withholding_tax_is_expense
    name: 納めた税金は会社の費用
    description: 従業員から預かった税金を税務署に納めたときに、会社の費用として記録してしまう
    correct: 納めたのは従業員のお金。預り金(負債)が減るだけで、会社の費用にはならない
    concepts: [advances_and_deposits, liability]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: deposit_payment_increases_liability
    name: 預り金を納めると負債が増える
    description: 預かっていたお金を納めたときに、納付を新しい義務と考えて、預り金(負債)が増えると読んでしまう
    correct: 納付は預かっていたお金を本人の代わりに渡すこと。納める義務が果たされて消えるので、預り金(負債)は減る
    concepts: [advances_and_deposits, liability]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: advance_for_others_is_expense
    name: 立て替えたお金は費用
    description: 従業員や取引先の代わりに払ったお金を、会社の費用として記録してしまう
    correct: 後で本人から返してもらうお金なので立替金(資産)。会社が使った犠牲ではない
    concepts: [advances_and_deposits, asset]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: suspense_is_expense
    name: 仮払いした時点で旅費
    description: 出張の前に渡した概算のお金を、渡した時点で旅費交通費にしてしまう
    correct: 使い道と金額が確定するまでは仮払金(資産)。精算のときに、実際に使った分だけが費用になる
    concepts: [suspense_accounts, expense]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: settlement_full_amount_is_expense
    name: 精算では仮払金の全額が費用
    description: 返ってきた分も含めて、仮払いした金額をそのまま費用にしてしまう
    correct: 費用になるのは実際に使った分だけ。残りは現金として戻り、資産が形を変えるだけ
    concepts: [suspense_accounts, expense]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: settlement_clears_only_spent
    name: 精算では使った分だけ仮払金を消す
    description: 精算で使った金額だけ仮払金を減らし、戻ってきたお金の記録を忘れて仮払金を残してしまう
    correct: 精算で仮払金は全額消す。使った分は費用になり、戻ってきた分は現金になる
    concepts: [suspense_accounts, asset]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: settlement_credits_cash
    name: 精算で現金を減らす
    description: 仮払いのときに減らした現金を精算でもう一度減らし、仮払金を消さずに残してしまう
    correct: 現金は仮払いのときに減っている。精算で消すのは仮払金で、現金は戻ってきた分だけ増える
    concepts: [suspense_accounts, asset]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: prepaid_asset_accounts_confused
    name: 先に払ったお金の科目を取り違える
    description: 立替金・仮払金・前払金を、どれも「先に払ったお金」として区別せずに使ってしまう
    correct: 立替金は他人の代わりに払って本人から返してもらうお金、仮払金は使い道や金額がまだ決まっていないお金、前払金は商品を受け取る前に払う手付金
    concepts: [advances_and_deposits, suspense_accounts, advance_payment_receipt]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: suspense_receipt_moved_to_liability
    name: 仮受金を別の負債へ移すだけ
    description: 入金の正体が権利の回収だと分かったのに、仮受金を前受金など別の負債へ移してしまう
    correct: 正体が分かったら、中身に合う科目へ移す。未収入金や売掛金の回収なら、仮受金を消してその権利(資産)を減らす
    concepts: [suspense_accounts, liability]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: suspense_receipt_is_revenue
    name: 正体不明の入金は売上
    description: 理由の分からない入金を、とりあえず売上として記録してしまう
    correct: 理由が分かるまでは仮受金(負債)に置く。売掛金の回収だったのか、前受金だったのかが分かってから本来の科目へ移す
    concepts: [suspense_accounts, revenue]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: deposit_is_revenue
    name: 預かったお金はもうけ
    description: 給料から差し引いた税金など、預かっているだけのお金を収益として記録してしまう
    correct: 預り金は他人のお金で、後で納める義務。会社のもうけではないので負債
    concepts: [advances_and_deposits, liability]
    remediation: receivables-and-payables/temporary-and-deposits
  - id: claim_ignores_receipts
    name: 受け取った分を引かない
    description: 相手への貸しを、売った額の合計のままにしている。受け取った分を引いていない
    correct: 貸しは、売った額から受け取った額を引いた残り。受け取った時点で、その分はもう貸しではない
    concepts: [personal_account]
    remediation: birth-of-double-entry/memorandum-and-personal-accounts
  - id: credit_purchase_as_claim
    name: 後払いで買っても貸し
    description: 相手から後払いで買った分を、相手への貸しに足している
    correct: 後払いで買ったのは、こちらが相手に負う側。人名勘定では右に書き、貸しからは引く
    concepts: [personal_account, debit_credit]
    remediation: birth-of-double-entry/memorandum-and-personal-accounts
  - id: personal_account_by_cash_direction
    name: 人名勘定の左右をお金や物の向きで決める
    description: 「お金や物を受け取ったら左、渡したら右」と考えて人名勘定に写している
    correct: 人名勘定の左右は、相手がこちらに負うか(左)、こちらが相手に負うか(右)で決まる。相手から受け取ると相手の負いが減るので右、相手に払うとこちらの負いが減るので左。物を売って渡しても、相手が負うので左
    concepts: [personal_account, debit_credit]
    remediation: birth-of-double-entry/memorandum-and-personal-accounts
  - id: balance_reads_one_side
    name: 残高を片側の合計と思う
    description: 人名勘定の残高を、左か右の片側の合計で答えている
    correct: 残高は左の合計と右の合計の差。差が左に残れば相手がこちらに負い、右に残ればこちらが相手に負う
    concepts: [personal_account]
    remediation: birth-of-double-entry/memorandum-and-personal-accounts
  - id: venture_sales_as_profit
    name: 売った額がもうけ
    description: 商いの1口のもうけを、売った額の合計で答えている。買った代金や運賃・関税を引いていない
    correct: もうけは、売った額からその口にかかった額(代金、運賃、関税)を引いた残り
    concepts: [venture_accounting]
    remediation: birth-of-double-entry/venture-profit-and-double-entry
  - id: venture_costs_only_price
    name: 運賃と関税を引かない
    description: 商いの1口のもうけを出すとき、売った額から買った代金だけを引き、運賃や関税を引いていない
    correct: 運賃や関税も、その口の商品を売るためにかかった額。口のページの左に書き、買った代金と一緒に売った額から引く
    concepts: [venture_accounting]
    remediation: birth-of-double-entry/venture-profit-and-double-entry
  - id: profit_is_cash
    name: もうけは現金に書く
    description: 口のもうけを元手や利益と損失のページへ移すときに、相手を現金にしている
    correct: 現金は代金を受け取ったときにすでに動いている。もうけを移しても現金は動かず、積み上がるのは元手(または利益と損失)
    concepts: [venture_accounting, double_entry]
    remediation: birth-of-double-entry/venture-profit-and-double-entry
  - id: closing_side_confused
    name: 残高を移す側を取り違える
    description: 口や利益と損失のページの残りを元手などへ移すとき、残っている側と同じ側に書いて、残高を消すどころか倍にしてしまう
    correct: 残高を消すには、残っている側の反対側に同じ額を書く。右に残っていれば左に書いて消し、移す先のページの右に同じ額を書く
    concepts: [double_entry, venture_accounting]
    remediation: birth-of-double-entry/venture-profit-and-double-entry
